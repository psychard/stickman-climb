<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + no user scaling: drags must never become pinch/zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- NOT black-translucent, and this is load-bearing. That style puts the web
         view *under* the status bar and the Dynamic Island, and iOS then reports
         env(safe-area-inset-top) as 0 anyway -- so #safe-probe reads zero, the HUD
         offsets by nothing, and the stamina bar ends up behind the clock. It only
         goes wrong in an installed app, which is the one place it can't be seen
         during development. With `black` the system insets the content below the
         status bar itself, which needs no inset arithmetic and knows the device.
         The strip it leaves is black against a #0b0d11 background. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The home-screen label on iOS. It comes from here, not from the manifest
         or the title, and iOS truncates it at roughly 12 characters. -->
    <meta name="apple-mobile-web-app-title" content="Stickman Climb" />
    <meta name="description" content="Drag a stick figure's hands and feet onto holds and climb thirty boulder problems." />

    <!-- Added to the home screen, this is what you tap. iOS reads
         apple-touch-icon and ignores the manifest's icons, so the 180px PNG is
         the one that matters on the target device; the rest are for Android and
         the browser tab. All of them are generated by `npm run icon`. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Stickman Climb</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0d11;
        /* Kill Safari's pull-to-refresh and rubber-band scroll. */
        overscroll-behavior: none;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* position:fixed/inset:0 tracks Safari's dynamic toolbar without a dvh
         reflow dance. The canvas is resized from JS off ResizeObserver. */
      #stage {
        position: fixed;
        inset: 0;
        touch-action: none;
      }

      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* Zero-size probe: JS reads its computed padding to learn the safe-area
         insets, which are only available to CSS via env(). */
      #safe-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        pointer-events: none;
        visibility: hidden;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <div id="safe-probe"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
